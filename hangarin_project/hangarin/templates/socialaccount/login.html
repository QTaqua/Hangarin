{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連携確認 — Hangarin</title>
    <style>
        :root {
            --bg-color: #FBF8F3;
            --card-bg: #F2EFE9;
            --primary-crimson: #802828;
            --primary-hover: #661f1f;
            --text-main: #2b2b2b;
            --text-muted: #706a65;
            --border-color: #e0dad1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .brand-header h1 {
            font-family: 'Times New Roman', Georgia, serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--primary-crimson);
            font-weight: 700;
        }

        .kanji-sub {
            display: block;
            font-size: 0.75rem;
            color: var(--primary-crimson);
            margin-top: 4px;
            letter-spacing: 3px;
        }

        .confirm-msg {
            margin: 1.8rem 0;
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .btn-primary {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary-crimson);
            color: #ffffff;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .auth-footer {
            margin-top: 1.5rem;
        }

        .auth-footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .auth-footer a:hover {
            color: var(--primary-crimson);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand-header">
            <h1>AUTHENTICATE</h1>
            <span class="kanji-sub">ソーシャル連携</span>
        </div>

        <p class="confirm-msg">
            You are about to sign in using your <strong>{{ provider.name }}</strong> account.
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn-primary">CONTINUE TO {{ provider.name|upper }}</button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'account_login' %}">← Cancel</a>
        </div>
    </div>
</body>
</html>
