<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Hangarin</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 8px; width: 100%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; text-align: center; }
        input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; margin-bottom: 1rem; box-sizing: border-box; background: #2b2b2b; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 0.6rem; background: #007bff; border: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
        a { color: #64b5f6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hangarin Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>
        <p style="text-align: center; font-size: 0.9rem; margin-top: 1rem;">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </p>
    </div>
</body>
</html>
