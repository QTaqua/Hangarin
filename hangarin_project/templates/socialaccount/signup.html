<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 — Hangarin</title>
    <style>
        :root {
            --bg-color: #FBF8F3;
            --card-bg: #F2EFE9;
            --primary-crimson: #802828;
            --primary-hover: #661f1f;
            --text-main: #2b2b2b;
            --text-muted: #706a65;
            --border-color: #e0dad1;
            --input-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand-header h1 {
            font-family: 'Times New Roman', Georgia, serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--primary-crimson);
            font-weight: 700;
        }

        .kanji-sub {
            display: block;
            font-size: 0.75rem;
            color: var(--primary-crimson);
            margin-top: 4px;
            letter-spacing: 3px;
        }

        p.intro {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        form p {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 0.65rem;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-crimson);
        }

        .btn {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: block;
            box-sizing: border-box;
            text-decoration: none;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            letter-spacing: 1px;
            background: var(--primary-crimson);
            color: #ffffff;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .auth-footer {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1.5rem;
        }

        .auth-footer a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .auth-footer a:hover {
            color: var(--primary-crimson);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand-header">
            <h1>COMPLETE SETUP</h1>
            <span class="kanji-sub">アカウント設定</span>
        </div>

        <p class="intro">
            You are signing in with <strong>{{ account.get_provider_account.get_brand.name }}</strong>. Please complete your account profile below.
        </p>

        <form method="post" action="{% url 'socialaccount_signup' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">COMPLETE REGISTRATION</button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'account_login' %}">← Return to Login</a>
        </div>
    </div>
</body>
</html>
